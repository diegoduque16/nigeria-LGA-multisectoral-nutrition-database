name = "nigeria-lga-multisectoral-nutrition-database"
workers_dev = true
preview_urls = false
main = "src/index.js"
compatibility_date = "2026-10-01"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "lga-reporting"
database_id = "3fb23d47-99fc-4cd7-a902-ecc91f5d8e44"
migrations_dir = "migrations"

[triggers]
crons = ["23 2 * * *"]

# Secret (add in the Cloudflare dashboard, type "Secret"):
#   SETUP_KEY  - any long phrase; needed once to create the first system administrator.
