name = "nigeria-lga-multisectoral-nutrition-database"
workers_dev = true
preview_urls = false
routes = [
  { pattern = "lganutritiondata.org", custom_domain = true },
  { pattern = "www.lganutritiondata.org", custom_domain = true },
]
main = "src/index.js"
compatibility_date = "2026-10-01"
keep_vars = true

[vars]
# Sender of reminder emails; must be on the domain verified in Resend. The key itself (EMAIL_API_KEY) is a Secret
# added in the Cloudflare dashboard, never here.
EMAIL_FROM = "LGA Scorecard <reports@lganutritiondata.org>"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "lga-reporting"
database_id = "3fb23d47-99fc-4cd7-a902-ecc91f5d8e44"
migrations_dir = "migrations"

[triggers]
crons = ["23 2 * * *"]

# Secret (add in the Cloudflare dashboard, type "Secret"):
#   SETUP_KEY      - any long phrase; needed once to create the first system administrator.
#   EMAIL_API_KEY  - the Resend API key (re_…), for reminder emails.
